name: Update summer kids activities

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 1 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check official sources and rebuild docs
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 1 * * *'
        run: node scripts/update_summer_kids_sources.js

      - name: Discover new official activity candidates
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * 1'
        run: node scripts/discover_summer_kids_activities.js
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "summer-kids-bot"
          git config user.email "actions@github.com"
          git add static/2026_summer_kids/data static/2026_summer_kids/docs
          git diff --cached --quiet || git commit -m "Update summer kids activity data"
          git push
