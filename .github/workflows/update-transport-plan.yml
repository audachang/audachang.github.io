name: Update transport-plan timetables

on:
  schedule:
    - cron: "0 19 * * 0"   # Monday 03:00 Asia/Taipei
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official timetables and rebuild data.js
        id: update
        run: python scripts/update_transport_plan.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name "transport-plan-bot"
          git config user.email "actions@github.com"
          git add static/transport-plan/data.js
          git diff --cached --quiet || git commit -m "Update transport-plan timetables"
          git pull --rebase
          git push

      - name: Fail if a source needs attention
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::One or more timetable sources failed or changed; see the job summary."
          exit 1
